version: '3.8'

services:
  rest-service:
    build: ./rest-service
    container_name: rest_service
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  grpc-service:
    build: ./grpc-service
    container_name: grpc_service
    ports:
      - "50051:50051"
    volumes:
      - ./data:/app/data